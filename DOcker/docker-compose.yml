services:
  php_bav_85:
    build:
      context: .
      dockerfile: DockerFile_php_85
    container_name: php_app_bav_85  
    image: php_app_bav_85:latest
    volumes:
      - ..:/var/www/html/bourseAuxVelos
    ports:
      - "8095:80"
    depends_on:
      - db_bav

  php_bav_82:
    build:
      context: .
      dockerfile: DockerFile_php_82
    container_name: php_app_bav_82
    image: php_app_bav_82:latest
    volumes:
      - ..:/var/www/html/bourseAuxVelos
    ports:
      - "8092:80"
    depends_on:
      - db_bav

  db_bav:
    image: mysql:8.0
    container_name: mysql_db_bav
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bav
      MYSQL_USER: bav
      MYSQL_PASSWORD: AVS44b@v!
    ports:
      - "3306:3306"
    volumes:
      #- db_data:/var/lib/mysql
      - ../dbmigration/init_db:/docker-entrypoint-initdb.d:ro   # monte tout le dossier db
      # Docker exécutera tous les .sql dans ce dossier dans l'ordre alphabétique
  phpmyadmin_bav:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_bav
    restart: always
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db_bav
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  db_data:
