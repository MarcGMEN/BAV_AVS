services:
  php:
    build:
      context: .
      dockerfile: DockerFile_php
    container_name: php_app
    volumes:
      - ..:/var/www/html
    ports:
      - "8090:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bav
      MYSQL_USER: bav
      MYSQL_PASSWORD: AVS44b@v!
    volumes:
      #- db_data:/var/lib/mysql
      - ../dbmigration/init_db:/docker-entrypoint-initdb.d:ro   # monte tout le dossier db
      # Docker exécutera tous les .sql dans ce dossier dans l'ordre alphabétique
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  db_data:
