<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <!-- Nous chargeons les fichiers CDN de Leaflet. Le CSS AVANT le JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.1/dist/leaflet.css" integrity="sha512-Rksm5RenBEKSKFjgI3a41vrjkw4EVPlJ3+OiI65vTjIdo9brlAacEuKOiQ5OFh7cOI1bkDwLqdLw3Zg0cRJAAQ==" crossorigin="" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.css" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link href='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css' rel='stylesheet' />


    <style type="text/css">
        #map {
            /* la carte DOIT avoir une hauteur sinon elle n'apparaît pas */
            height: 800px;
            width: 1200px;
        }
    </style>
    <title>Carte</title>
    <!-- Fichiers Javascript -->
    <script src="https://unpkg.com/leaflet@1.3.1/dist/leaflet.js" integrity="sha512-/Nsx9X4HebavoBvEBuyp3I7od5tA0UzAxs+j83KgC8PU0kgB4XiK4Lfe4y4cgBtaRJQEIFCW+oC506aPT2L1zw==" crossorigin=""></script>
    <script type='text/javascript' src='https://unpkg.com/leaflet.markercluster@1.3.0/dist/leaflet.markercluster.js'></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="JS/geoPosition.js"></script>
    <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js'></script>

    <script type="text/javascript">
        var tabCdpLatLon = [];
        window.onload = function() {


            initMap();
            geoPosClient2('44600');
            geoPosClient2('56130');
            geoPosClient2('nivillac, 56130');
            geoPosClient2('22350');
            geoPosClient2('la roche bernard, 56130');

            geoPosClient2('saint-nazaire');
        };

        function x_add_cdp(adress, lat, lon, info) {
            addMarker(lat, lon, adress, 0, info);
        }

        function geocode(address) {
            const url = 'https://nominatim.openstreetmap.org/search?format=json&q=' +
                encodeURIComponent(address + ', France');

            fetch(url)
                .then(response => response.json())
                .then(results => {
                    if (results.length > 0) {
                        const r = results[0];
                        console.log('Résultat :', r.display_name);
                        console.log('Coordonnées :', r.lat, r.lon);
                    } else {
                        console.log('Aucun résultat');
                    }
                })
                .catch(err => console.error('Erreur géocodage :', err));
        }
    </script>
</head>

<body>
    <div id="map">
        <!-- Ici s'affichera la carte -->
    </div>

</body>

</html>
